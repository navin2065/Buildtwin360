<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142e20"/>
      <stop offset="65%" stop-color="#070e0a"/>
      <stop offset="100%" stop-color="#030604"/>
    </radialGradient>
    
    <!-- Antique Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0bd"/>
      <stop offset="35%" stop-color="#e0bb42"/>
      <stop offset="70%" stop-color="#997519"/>
      <stop offset="100%" stop-color="#f3d77d"/>
    </linearGradient>

    <!-- Antique Gold Letter Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff3ce"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a87f18"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for 'A' Monogram -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Forest Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  
  <!-- Outer Luxurious Gold Ring -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="url(#goldBorder)" stroke-width="4.5"/>
  
  <!-- Inner Delicate Dotted Accent Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 3"/>

  <!-- Centered 'A' Monogram matching SurpriseLoader -->
  <text 
    x="64" 
    y="80" 
    text-anchor="middle" 
    font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
    font-size="64" 
    font-weight="900" 
    letter-spacing="1"
    fill="url(#goldText)" 
    filter="url(#goldGlow)"
  >A</text>
</svg>
